cross_domain_note: >-
  The ITA model and the enforcement model do not join. An establishment that files a 300A has
  no key into the inspection record for the same site — the only shared vocabulary is NAICS and
  the establishment name/address, both of which are free text. An agent cannot programmatically
  connect what an employer reported to what OSHA inspected.
