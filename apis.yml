apis:
  - aid: osha:osha-injury-tracking-application
    name: OSHA Injury Tracking Application (ITA) API
    description: >-
      OSHA's own API for electronically submitting establishment injury and illness records —
      Form 300A summaries and Form 300/301 case data — under 29 CFR 1904.41. Nine documented
      operations across establishments, forms and submissions, authenticated with an
      Authorization Bearer token read from a logged-in ITA account. Create and edit endpoints
      accept either a single JSON object or an array, responses carry a hypermedia links array,
      and a separate preview.osha.gov host runs the same validation rules for testing.
    humanURL: https://www.osha.gov/injuryreporting/ita
    baseURL: https://www.osha.gov/oshaApi/v1
    tags:
      - Injury Reporting
      - Recordkeeping
      - Form 300A
      - Compliance
    properties:
      - type: Documentation
        url: https://www.osha.gov/injuryreporting
      - type: APIReference
        url: https://www.osha.gov/sites/default/files/ita/documentation/osha_injury-tracking-application-api-documentation-v1.pdf
      - type: GettingStarted
        url: https://www.osha.gov/injuryreporting/ita
      - type: Login
        url: https://www.osha.gov/injuryreporting/ita
      - type: Sandbox
        url: https://preview.osha.gov/injuryreporting/ita
      - type: Support
        url: https://www.osha.gov/injuryreporting/ita/help-request-form
  - aid: osha:osha-enforcement-data
    name: OSHA Enforcement Data API
    description: >-
      Read-only access to OSHA enforcement records — inspections, violations, citation history,
      general duty clause citations, accidents, accident abstracts and accident injuries —
      published as ten related tables through the U.S. Department of Labor's data API, keyed on
      activity_nr and summary_nr, with limit/offset paging capped at 200 records per request.
      Served by OSHA's parent department rather than by osha.gov.
    humanURL: https://data.dol.gov/
    baseURL: https://data.dol.gov/get/
    tags:
      - Enforcement
      - Inspections
      - Violations
      - Open Data
