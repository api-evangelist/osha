aid: osha
name: OSHA
description: >-
  The Occupational Safety and Health Administration is the U.S. federal agency, part of the
  Department of Labor, responsible for setting and enforcing workplace safety and health
  standards. OSHA operates two very different API surfaces. The Injury Tracking Application
  (ITA) API at www.osha.gov/oshaApi/v1 is a write channel employers are legally required to use
  under 29 CFR 1904.41 to submit OSHA Form 300A summaries and Form 300/301 case data, secured
  with a bearer token issued from a logged-in ITA account and backed by a separate
  preview.osha.gov sandbox. The OSHA enforcement datasets — inspections, violations, citations,
  accidents and injuries, roughly 90,000 inspections a year — are published as read-only tables
  through the Department of Labor's data API. Neither surface publishes an OpenAPI: the ITA
  contract is distributed as a PDF.
