description: >-
  OSHA publishes NO plans, tiers or pricing for either of its API surfaces. Both are
  taxpayer-funded U.S. federal government surfaces provided at no charge: the Injury Tracking
  Application API is a regulatory filing channel that employers are REQUIRED to use under
  29 CFR 1904.41 (so there is nothing to sell), and the OSHA enforcement datasets published
  through the DOL data API are public records released at no cost. Searched the OSHA site, the
  ITA pages and the DOL developer portal for any pricing, quota, tier or paid-support page —
  none exists.
supersedes: >-
  This file replaces a 2026-05-04 scaffold that asserted a fabricated "osha-free" tier with a
  1,000 request/month quota and a 10 req/min rate limit. OSHA publishes no such tier and no such
  numbers. Recorded here as an honest zero rather than an invented plan.
plan_count: 0
plans: []
access:
  model: free-public-sector
  cost: none
  ita_gate: >-
    Free but account-gated — an ITA account is required, and the API token is issued from inside
    that account. Access is scoped to the employer's own establishments.
  enforcement_gate: >-
    Free but key-gated, and the key cannot currently be obtained: the DOL developer portal states
    "New API Token Creation is Temporarily Disabled" at https://devtools.dol.gov/developer.
