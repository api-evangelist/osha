ownership_note: >-
  OSHA publishes no client library of its own. The SDKs below are published by OSHA's
  parent department, the U.S. Department of Labor, on the USDepartmentofLabor GitHub org,
  and they are the documented clients for the DOL data API that serves the OSHA
  Enforcement datasets (accident, inspection, violation, ...) this repo catalogs. They are
  recorded here as first-party to the OSHA Enforcement Data API surface, NOT as OSHA-authored
  libraries, and they do not cover the OSHA-owned Injury Tracking Application (ITA) API at
  www.osha.gov/oshaApi/v1, which ships no SDK at all.
registry_note: >-
  None of the eight SDKs is published to any package registry. npm, PyPI, RubyGems
  (dol_data_sdk -> 404), Packagist (usdepartmentoflabor/php_doldatasdk -> 404), NuGet,
  crates.io and pkg.go.dev were all checked and hold nothing. Distribution is
  git-clone / direct download from GitHub only, so there is no version metadata endpoint
  to read; `version: null` below is "checked, nothing published", not "not checked".
decay_signal: >-
  ALL EIGHT repositories are ARCHIVED (read-only) on GitHub. The most recent push to any
  of them is 2017-02-16 (PHP); five were last touched in 2015. The API they wrap is still
  documented as current on the DOL developer portal, so every published client for the
  OSHA enforcement data surface has been frozen for eight to eleven years.
